name: Windows Bridge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: buzz-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: buzz-bridge/package-lock.json
      - run: npm.cmd ci
      - run: npm.cmd test
